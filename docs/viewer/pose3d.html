<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SwingForm AI · 3D Pose Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #070810;
    --panel: #0d0f1c;
    --border: #1a1f3a;
    --cyan: #00e5ff;
    --gold: #ffc940;
    --green: #39ff85;
    --red: #ff4060;
    --text: #c8d0e8;
    --muted: #4a5278;
    --phase-address: #7b8cff;
    --phase-top: #39ff85;
    --phase-impact: #ff4060;
    --phase-finish: #ffc940;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    height: 100vh;
    display: grid;
    grid-template-columns: 280px 1fr;
    grid-template-rows: 1fr 120px;
    overflow: hidden;
  }

  /* ── sidebar ── */
  #sidebar {
    grid-row: 1 / 3;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 24px 20px;
    gap: 28px;
    overflow-y: auto;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 3px;
    color: var(--cyan);
    border-bottom: 1px solid var(--border);
    padding-bottom: 16px;
  }
  .logo span { color: var(--muted); font-size: 11px; display: block; letter-spacing: 2px; margin-top: 2px; font-family: 'DM Mono', monospace; }

  .section-label {
    font-size: 9px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  /* key pose buttons */
  .phase-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .phase-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    padding: 10px 8px;
    cursor: pointer;
    transition: all 0.18s;
    text-transform: uppercase;
    position: relative;
    overflow: hidden;
  }
  .phase-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.18s;
  }
  .phase-btn[data-phase="address"] { border-color: var(--phase-address); }
  .phase-btn[data-phase="address"]:hover, .phase-btn[data-phase="address"].active { background: var(--phase-address); color: #000; }
  .phase-btn[data-phase="top"] { border-color: var(--phase-top); }
  .phase-btn[data-phase="top"]:hover, .phase-btn[data-phase="top"].active { background: var(--phase-top); color: #000; }
  .phase-btn[data-phase="impact"] { border-color: var(--phase-impact); }
  .phase-btn[data-phase="impact"]:hover, .phase-btn[data-phase="impact"].active { background: var(--phase-impact); color: #fff; }
  .phase-btn[data-phase="finish"] { border-color: var(--phase-finish); }
  .phase-btn[data-phase="finish"]:hover, .phase-btn[data-phase="finish"].active { background: var(--phase-finish); color: #000; }
  .phase-btn .swing-num {
    display: block;
    font-size: 8px;
    opacity: 0.6;
    margin-bottom: 2px;
  }

  /* view buttons */
  .view-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
  }
  .view-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 1px;
    padding: 8px 4px;
    cursor: pointer;
    transition: all 0.18s;
    text-transform: uppercase;
  }
  .view-btn:hover, .view-btn.active { background: var(--cyan); color: #000; border-color: var(--cyan); }

  /* stats */
  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 6px 0;
    border-bottom: 1px solid #12152a;
    font-size: 11px;
  }
  .stat-label { color: var(--muted); font-size: 10px; }
  .stat-val { color: var(--cyan); font-weight: 500; }

  /* playback */
  .playback-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .ctrl-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    padding: 7px 12px;
    cursor: pointer;
    transition: all 0.15s;
    flex: 1;
  }
  .ctrl-btn:hover { background: var(--border); }
  .ctrl-btn.playing { border-color: var(--cyan); color: var(--cyan); }

  .speed-select {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    padding: 7px 8px;
    cursor: pointer;
    flex: 1;
  }

  /* ghost trail toggle */
  .toggle-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--muted);
  }
  .toggle {
    width: 36px; height: 18px;
    background: var(--border);
    border-radius: 9px;
    position: relative;
    cursor: pointer;
    transition: background 0.2s;
    border: none;
  }
  .toggle.on { background: var(--cyan); }
  .toggle::after {
    content: '';
    position: absolute;
    width: 12px; height: 12px;
    background: #fff;
    border-radius: 50%;
    top: 3px; left: 3px;
    transition: left 0.2s;
  }
  .toggle.on::after { left: 21px; }

  /* ── canvas ── */
  #canvas-wrap {
    position: relative;
    overflow: hidden;
    background: radial-gradient(ellipse at 40% 40%, #0d1233 0%, #070810 70%);
  }
  #canvas-wrap canvas { display: block; width: 100% !important; height: 100% !important; }

  /* overlay label */
  #phase-label {
    position: absolute;
    top: 24px; left: 28px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 42px;
    letter-spacing: 4px;
    color: transparent;
    -webkit-text-stroke: 1px rgba(255,255,255,0.12);
    pointer-events: none;
    transition: all 0.3s;
  }
  #frame-counter {
    position: absolute;
    top: 28px; right: 28px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
  }

  /* ── timeline ── */
  #timeline-wrap {
    background: var(--panel);
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 16px 28px 20px;
    gap: 10px;
  }

  #timeline-track {
    position: relative;
    height: 36px;
    background: #0a0c18;
    border: 1px solid var(--border);
    border-radius: 2px;
    cursor: pointer;
  }
  #timeline-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    background: linear-gradient(90deg, var(--cyan) 0%, #0066aa 100%);
    opacity: 0.35;
    pointer-events: none;
    transition: width 0.05s linear;
  }
  #timeline-head {
    position: absolute;
    top: -3px; bottom: -3px;
    width: 2px;
    background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
    pointer-events: none;
    transition: left 0.05s linear;
  }
  .event-marker {
    position: absolute;
    top: 0; bottom: 0;
    width: 2px;
    opacity: 0.7;
    pointer-events: none;
  }
  .event-marker-label {
    position: absolute;
    top: -18px;
    font-size: 8px;
    letter-spacing: 1px;
    white-space: nowrap;
    transform: translateX(-50%);
    pointer-events: none;
  }

  #time-display {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
  }
  #current-time { color: var(--cyan); }
</style>
</head>
<body>

<!-- ── SIDEBAR ─────────────────────────────────────────── -->
<aside id="sidebar">

  <div class="logo">
    SWINGFORM AI
    <span>3D POSE VIEWER · GOLF</span>
  </div>

  <!-- Key Poses -->
  <div>
    <div class="section-label">Key Poses</div>
    <div class="phase-grid" id="phase-btns"></div>
  </div>

  <!-- Camera Views -->
  <div>
    <div class="section-label">Camera</div>
    <div class="view-grid">
      <button class="view-btn active" onclick="setView('persp')">3D</button>
      <button class="view-btn" onclick="setView('front')">FRONT</button>
      <button class="view-btn" onclick="setView('side')">SIDE</button>
      <button class="view-btn" onclick="setView('top')">TOP</button>
    </div>
  </div>

  <!-- Stats -->
  <div>
    <div class="section-label">Session Info</div>
    <div class="stat-row">
      <span class="stat-label">FRAMES</span>
      <span class="stat-val" id="stat-frames">—</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">FPS</span>
      <span class="stat-val" id="stat-fps">—</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">SWINGS</span>
      <span class="stat-val" id="stat-swings">—</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">CURRENT PHASE</span>
      <span class="stat-val" id="stat-phase">—</span>
    </div>
  </div>

  <!-- Options -->
  <div>
    <div class="section-label">Display</div>
    <div class="toggle-row">
      <span>Ghost Trail</span>
      <button class="toggle on" id="ghost-toggle" onclick="toggleGhost()"></button>
    </div>
    <div class="toggle-row" style="margin-top:10px">
      <span>Floor Grid</span>
      <button class="toggle on" id="grid-toggle" onclick="toggleGrid()"></button>
    </div>
  </div>

  <!-- Playback -->
  <div>
    <div class="section-label">Playback</div>
    <div class="playback-row">
      <button class="ctrl-btn" id="play-btn" onclick="togglePlay()">▶ PLAY</button>
      <select class="speed-select" id="speed-sel" onchange="setSpeed(this.value)">
        <option value="0.25">0.25×</option>
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="2">2×</option>
      </select>
    </div>
  </div>

</aside>

<!-- ── CANVAS ─────────────────────────────────────────── -->
<main id="canvas-wrap">
  <div id="phase-label"></div>
  <div id="frame-counter">—</div>
</main>

<!-- ── TIMELINE ──────────────────────────────────────── -->
<div id="timeline-wrap">
  <div id="timeline-track">
    <div id="timeline-fill"></div>
    <div id="timeline-head" style="left:0"></div>
  </div>
  <div id="time-display">
    <span id="current-time">0.000s</span>
    <span id="total-time">—</span>
  </div>
</div>

<!-- ── THREE.JS ───────────────────────────────────────── -->

  }
}
</script>

  return new THREE.Vector3(-j[0], -j[1], j[2]);
}

// ── SCENE SETUP ──────────────────────────────────────────
const canvas = document.createElement('canvas');
document.getElementById('canvas-wrap').appendChild(canvas);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
scene.background = null;

const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 50);
camera.position.set(0, 1.2, 3.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1;
controls.maxDistance = 8;

// Lights
scene.add(new THREE.AmbientLight(0x1a2040, 3));
const dirLight = new THREE.DirectionalLight(0x4488ff, 2.5);
dirLight.position.set(2, 4, 2);
scene.add(dirLight);
const rimLight = new THREE.DirectionalLight(0x00e5ff, 1.2);
rimLight.position.set(-3, 1, -2);
scene.add(rimLight);
const fillLight = new THREE.DirectionalLight(0xffc940, 0.6);
fillLight.position.set(0, -2, 3);
scene.add(fillLight);

// Floor grid
const gridHelper = new THREE.GridHelper(4, 20, 0x1a2040, 0x111830);
gridHelper.position.y = -1.0;
scene.add(gridHelper);

// ── SKELETON OBJECTS ──────────────────────────────────────
const skeletonGroup = new THREE.Group();
scene.add(skeletonGroup);

const ghostGroup = new THREE.Group();
ghostGroup.visible = true;
scene.add(ghostGroup);

// Build bone mesh between two points
function makeBone(color, radius = 0.012) {
  const geo = new THREE.CylinderGeometry(radius, radius, 1, 8);
  const mat = new THREE.MeshStandardMaterial({
    color, emissive: color, emissiveIntensity: 0.4,
    roughness: 0.3, metalness: 0.5,
  });
  return new THREE.Mesh(geo, mat);
}

function makeJoint(color, radius = 0.022) {
  const geo = new THREE.SphereGeometry(radius, 12, 8);
  const mat = new THREE.MeshStandardMaterial({
    color, emissive: color, emissiveIntensity: 0.5,
    roughness: 0.2, metalness: 0.6,
  });
  return new THREE.Mesh(geo, mat);
}

function positionBone(mesh, a, b) {
  const dir = b.clone().sub(a);
  const len = dir.length();
  if (len < 0.001) return;
  mesh.scale.y = len;
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    dir.normalize()
  );
}

// Create permanent bone + joint meshes
const boneMeshes = {};
EDGES.forEach(([a, b]) => {
  const key = a + '-' + b;
  const color = EDGE_COLORS[key] || 0x00e5ff;
  const m = makeBone(color);
  boneMeshes[key] = m;
  skeletonGroup.add(m);
});

const jointMeshes = {};
const JOINTS = [...new Set(EDGES.flat())];
JOINTS.forEach(name => {
  const color = JOINT_COLORS[name] || 0x00e5ff;
  const m = makeJoint(color);
  jointMeshes[name] = m;
  skeletonGroup.add(m);
});

// Head sphere for nose
const headMesh = makeJoint(0xffffff, 0.04);
skeletonGroup.add(headMesh);

// ── GHOST TRAIL ───────────────────────────────────────────
const GHOST_STEPS = 5;
const GHOST_STRIDE = 4;  // frames between ghosts
const ghostBones = [];   // array of ghost edge meshes per step
const ghostJoints = [];

for (let g = 0; g < GHOST_STEPS; g++) {
  const alpha = (g + 1) / (GHOST_STEPS + 1) * 0.18;
  const gbones = {};
  EDGES.forEach(([a, b]) => {
    const key = a + '-' + b;
    const color = EDGE_COLORS[key] || 0x00e5ff;
    const m = makeBone(color, 0.007);
    m.material = m.material.clone();
    m.material.transparent = true;
    m.material.opacity = alpha;
    m.material.emissiveIntensity = 0.1;
    ghostBones[g] = ghostBones[g] || {};
    ghostBones[g][key] = m;
    ghostGroup.add(m);
  });
}

// ── FRAME LOOKUP ──────────────────────────────────────────
const frames = POSE_DATA.frames;
const events = POSE_DATA.events;
const fps = POSE_DATA.fps;
const totalTime = frames[frames.length - 1].t;

let currentFrame = 0;
let playing = false;
let speed = 1.0;
let showGhost = true;
let lastTimestamp = null;
let accumTime = 0;

// frame index by event
const eventFrameMap = {};
events.forEach(e => {
  const key = e.swing + '-' + e.phase;
  eventFrameMap[key] = e.frame;
});

// nearest frame index for a given frame number
function frameIdxForFrame(fi) {
  let lo = 0, hi = frames.length - 1;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (frames[mid].fi < fi) lo = mid + 1;
    else hi = mid;
  }
  return lo;
}

// ── APPLY FRAME ───────────────────────────────────────────
function applyFrame(idx) {
  const f = frames[idx];
  if (!f) return;
  const joints = f.j;

  // Position bones
  EDGES.forEach(([a, b]) => {
    const key = a + '-' + b;
    if (!joints[a] || !joints[b]) return;
    positionBone(boneMeshes[key], mpToThree(joints[a]), mpToThree(joints[b]));
  });

  // Position joints
  JOINTS.forEach(name => {
    if (!joints[name]) return;
    jointMeshes[name].position.copy(mpToThree(joints[name]));
  });

  // Head (nose)
  if (joints.nose) headMesh.position.copy(mpToThree(joints.nose));

  // Ghost frames
  if (showGhost) {
    for (let g = 0; g < GHOST_STEPS; g++) {
      const gi = Math.max(0, idx - (g + 1) * GHOST_STRIDE);
      const gf = frames[gi];
      if (!gf) continue;
      const gj = gf.j;
      EDGES.forEach(([a, b]) => {
        const key = a + '-' + b;
        if (!gj[a] || !gj[b] || !ghostBones[g]) return;
        const m = ghostBones[g][key];
        if (!m) return;
        positionBone(m, mpToThree(gj[a]), mpToThree(gj[b]));
      });
    }
  }

  // UI
  const progress = idx / (frames.length - 1);
  document.getElementById('timeline-fill').style.width = (progress * 100) + '%';
  document.getElementById('timeline-head').style.left = (progress * 100) + '%';
  document.getElementById('current-time').textContent = f.t.toFixed(3) + 's';
  document.getElementById('frame-counter').textContent = 'FRAME  ' + f.fi + ' / ' + frames[frames.length-1].fi;

  // Phase label
  const activeEvent = events.find(e => {
    const nextIdx = events.indexOf(e) + 1;
    const nextFi = nextIdx < events.length ? events[nextIdx].frame : Infinity;
    return f.fi >= e.frame && f.fi < nextFi;
  });
  const phaseLabel = document.getElementById('phase-label');
  const statPhase = document.getElementById('stat-phase');
  if (activeEvent) {
    phaseLabel.textContent = activeEvent.phase.toUpperCase();
    const colors = {address:'#7b8cff',top:'#39ff85',impact:'#ff4060',finish:'#ffc940'};
    phaseLabel.style['-webkit-text-stroke'] = '1px ' + (colors[activeEvent.phase] || 'rgba(255,255,255,0.12)');
    statPhase.textContent = 'S' + activeEvent.swing + ' ' + activeEvent.phase.toUpperCase();

    document.querySelectorAll('.phase-btn').forEach(btn => {
      btn.classList.toggle('active',
        btn.dataset.phase === activeEvent.phase && btn.dataset.swing == activeEvent.swing);
    });
  } else {
    phaseLabel.textContent = '';
    statPhase.textContent = '—';
    document.querySelectorAll('.phase-btn').forEach(b => b.classList.remove('active'));
  }
}

// ── RENDER LOOP ───────────────────────────────────────────
function animate(ts) {
  requestAnimationFrame(animate);

  if (playing) {
    if (lastTimestamp !== null) {
      const delta = (ts - lastTimestamp) / 1000 * speed;
      accumTime += delta;
      const targetFrame = Math.round(accumTime * fps);
      currentFrame = targetFrame % frames.length;
    }
    lastTimestamp = ts;
  } else {
    lastTimestamp = null;
  }

  applyFrame(currentFrame);
  controls.update();
  renderer.render(scene, camera);
}

// ── RESIZE ────────────────────────────────────────────────
function onResize() {
  const wrap = document.getElementById('canvas-wrap');
  const w = wrap.clientWidth, h = wrap.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);
onResize();

// ── TIMELINE INTERACTION ──────────────────────────────────
const track = document.getElementById('timeline-track');
let dragging = false;

function seekToRatio(ratio) {
  ratio = Math.max(0, Math.min(1, ratio));
  currentFrame = Math.round(ratio * (frames.length - 1));
  accumTime = frames[currentFrame].t;
  applyFrame(currentFrame);
}

track.addEventListener('mousedown', e => {
  dragging = true;
  seekToRatio((e.clientX - track.getBoundingClientRect().left) / track.clientWidth);
});
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  seekToRatio((e.clientX - track.getBoundingClientRect().left) / track.clientWidth);
});
window.addEventListener('mouseup', () => dragging = false);

// Event markers on timeline
const swingColors = {address:'#7b8cff',top:'#39ff85',impact:'#ff4060',finish:'#ffc940'};
events.forEach(e => {
  const ratio = frameIdxForFrame(e.frame) / (frames.length - 1);
  const marker = document.createElement('div');
  marker.className = 'event-marker';
  marker.style.left = (ratio * 100) + '%';
  marker.style.background = swingColors[e.phase];
  const label = document.createElement('div');
  label.className = 'event-marker-label';
  label.style.left = (ratio * 100) + '%';
  label.style.color = swingColors[e.phase];
  label.style.top = '-18px';
  label.textContent = 'S' + e.swing + ' ' + e.phase[0].toUpperCase();
  track.appendChild(marker);
  track.appendChild(label);
});

// ── PHASE BUTTONS ─────────────────────────────────────────
const phaseGrid = document.getElementById('phase-btns');
const swingNums = [...new Set(events.map(e => e.swing))];
swingNums.forEach(sw => {
  ['address','top','impact','finish'].forEach(ph => {
    const e = events.find(e => e.swing === sw && e.phase === ph);
    if (!e) return;
    const btn = document.createElement('button');
    btn.className = 'phase-btn';
    btn.dataset.phase = ph;
    btn.dataset.swing = sw;
    btn.innerHTML = '<span class="swing-num">SWING ' + sw + '</span>' + ph.toUpperCase();
    btn.onclick = () => {
      currentFrame = frameIdxForFrame(e.frame);
      accumTime = frames[currentFrame].t;
      applyFrame(currentFrame);
    };
    phaseGrid.appendChild(btn);
  });
});

// ── STATS ─────────────────────────────────────────────────
document.getElementById('stat-frames').textContent = frames.length;
document.getElementById('stat-fps').textContent = fps.toFixed(1);
document.getElementById('stat-swings').textContent = swingNums.length;
document.getElementById('total-time').textContent = totalTime.toFixed(3) + 's';

// ── GLOBALS FOR BUTTONS ───────────────────────────────────
window.togglePlay = function() {
  playing = !playing;
  if (playing) accumTime = frames[currentFrame].t;
  const btn = document.getElementById('play-btn');
  btn.textContent = playing ? '⏸ PAUSE' : '▶ PLAY';
  btn.classList.toggle('playing', playing);
};

window.setSpeed = function(v) { speed = parseFloat(v); };

window.toggleGhost = function() {
  showGhost = !showGhost;
  ghostGroup.visible = showGhost;
  document.getElementById('ghost-toggle').classList.toggle('on', showGhost);
};

window.toggleGrid = function() {
  gridHelper.visible = !gridHelper.visible;
  document.getElementById('grid-toggle').classList.toggle('on', gridHelper.visible);
};

const VIEWS = {
  persp: { pos: [0, 1.2, 3.5], target: [0, 0, 0] },
  front:  { pos: [0, 0.4, 4.0], target: [0, 0.4, 0] },
  side:   { pos: [4.0, 0.4, 0], target: [0, 0.4, 0] },
  top:    { pos: [0, 5.0, 0.001], target: [0, 0, 0] },
};

window.setView = function(name) {
  const v = VIEWS[name];
  camera.position.set(...v.pos);
  controls.target.set(...v.target);
  controls.update();
  document.querySelectorAll('.view-btn').forEach(b =>
    b.classList.toggle('active', b.textContent.toLowerCase().trim() === name ||
      (name==='persp' && b.textContent.trim()==='3D')));
};

animate(0);
</script>
</body>
</html>
